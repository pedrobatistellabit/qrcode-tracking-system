<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Salva essa também</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root { --red: #ff0000; }
      /* Reset mínimo */
      html, body { height: 100%; margin: 0; background: #fff; }

      /* Centraliza o conteúdo */
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* Caixa externa grande e vermelha */
      .outer {
        border: 16px solid var(--red);
        box-sizing: border-box;
        width: 92vw;
        max-width: 1400px;
        height: 78vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
      }

      /* Caixa interna também grande e vermelha */
      .inner {
        border: 12px solid var(--red);
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
        color: var(--red);
        font-size: 7vw; /* texto bem grande e responsivo */
        line-height: 1;
        text-transform: none;
        background: transparent; /* mantem só o vermelho nas bordas e texto */
      }

      /* Garante legibilidade em telas pequenas */
      @media (max-width: 480px) {
        .outer { padding: 20px; height: 60vh; }
        .inner { padding: 16px; font-size: 9vw; }
      }
    </style>
  </head>
  <body>
    <div class="outer">
      <div class="inner">salva essa tambem</div>
    </div>
  </body>
</html>
