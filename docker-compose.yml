version: '3.8'

services:
  # Backend Flask
  backend:
    build: ./backend
    container_name: qrcode-tracking-backend
    ports:
      - "5001:5000"
    environment:
      - DATABASE_TYPE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=qrcode_tracking
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - SECRET_KEY=dev-secret-key
      - API_KEY=admin-api-key
      - BASE_URL=http://72.60.8.131:5001
      - DEBUG=True
    volumes:
      - ./backend:/app
      - qrcode-data:/app/data
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - qrcode-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: qrcode-tracking-db
    environment:
      - POSTGRES_DB=qrcode_tracking
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - qrcode-network

volumes:
  postgres-data:
  qrcode-data:

networks:
  qrcode-network:
    driver: bridge

